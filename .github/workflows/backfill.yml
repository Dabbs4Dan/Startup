name: kalshi-twins data backfill

# DAILY MODE (turned on 2026-11-25 at Dan's request): runs every day at 11:17 UTC (6:17 AM ET,
# after AAA posts), plus whenever tools/ or this file changes, or by hand from the Actions tab.
on:
  push:
    branches: [kalshi-twins]
    paths: ["tools/**", "!tools/connectivity_pull.py", "!tools/live_recorder.py", ".github/workflows/backfill.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

# Only one run at a time; a newer push cancels an older run (avoids push conflicts on data commits).
concurrency:
  group: kalshi-twins-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + backfill
        run: |
          pip install numpy
          python3 tools/build_db.py
          python3 tools/backfill.py
          python3 tools/backfill_history.py KXDIESELD
          python3 tools/story.py
      - name: Daily recorders (AAA states, HO at 10 AM) - fail soft
        continue-on-error: true
        run: python3 tools/daily_recorders.py
      - name: Kalshi trade tape + 1-min candles - fail soft
        continue-on-error: true
        timeout-minutes: 90
        run: python3 tools/kalshi_trades.py 60
      - name: Research panel (one row per day)
        run: |
          python3 tools/panel.py
          python3 tools/testing.py
          python3 tools/testing.py 0 2026-08-03 2026-09-25
      - name: Commit data
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ research/connectivity/
          git diff --cached --quiet || git commit -m "data: backfill $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin kalshi-twins || true
          git push origin HEAD:kalshi-twins
