name: kalshi-twins connectivity pull

# One-shot connection tests (tier 2). Runs when tools/connectivity_pull.py changes, or by hand.
on:
  push:
    branches: [kalshi-twins]
    paths: ["tools/connectivity_pull.py", ".github/workflows/connectivity.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull
        run: python3 tools/connectivity_pull.py
      - name: Commit
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/connectivity/
          git commit -m "connectivity: tier 2 raw pull" || echo "nothing to commit"
          git pull --rebase origin kalshi-twins
          git push origin kalshi-twins
