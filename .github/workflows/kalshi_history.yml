name: kalshi-twins kalshi full history

# Every settled market + hourly candles for the 6 fuel series (daily / weekly / monthly x diesel / gas), from the
# live AND historical Kalshi tiers. Writes CSVs under data/lake/kalshi/ only (never a database). Resumable.
# Small series first; one commit per series so partial results land early.
on:
  push:
    branches: [kalshi-twins]
    paths: ["tools/pull_kalshi_history.py", "tools/backtest_master.py", ".github/workflows/kalshi_history.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-twins-kalshi-history
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull each series, commit after each
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/pull_kalshi_history.py DISCOVER || echo "discover failed"
          # core 7 first, then older / related fuel markets found by DISCOVER (2026-11-26), then the 100 state-level
          # daily gas series (their settlements are AAA state prices). Raw only: the master maps a series when vetted.
          STATES=$(python3 -c "import csv; print(' '.join(sorted(r['ticker'] for r in csv.DictReader(open('data/lake/kalshi/_series_discovered.csv')) if r['ticker'].startswith(('KXAAAGASD','KXAAAGASCD')) and len(r['ticker']) in (11, 12))))" 2>/dev/null || true)
          for S in KXDIESELMON KXAAAGASM KXDIESELM KXDIESELW KXAAAGASW KXDIESELD KXAAAGASD \
                   KXDIESEL KXGAS KXGAS-MONTH KXGASD KXAAAGASWNJ KXAAAGASMTX KXDIESELMONAK KXHOILW KXHOILMON KXJETFUEL $STATES; do
            python3 tools/pull_kalshi_history.py "$S" || echo "$S failed"
            git add data/lake/kalshi/
            if ! git diff --cached --quiet; then
              git commit -q -m "kalshi history: $S $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs origin kalshi-twins && git push -q origin HEAD:kalshi-twins && break; sleep 15; done
            fi
          done
      - name: Rebuild the backtest master (one table for both fuels, all three time slices)
        if: always()
        run: |
          pip install -q pandas numpy tabulate
          python3 tools/backtest_master.py || echo "master build failed"
          git add data/lake/master/
          if ! git diff --cached --quiet; then
            git commit -q -m "backtest master: rebuilt $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do git pull -q --rebase -X theirs origin kalshi-twins && git push -q origin HEAD:kalshi-twins && break; sleep 15; done
          fi
