name: kalshi-twins live recorder

# Free 24/7-ish recorder: 4 "shifts" a day, each loops ~5h40m taking a snapshot every 5 min (see tools/live_recorder.py).
# Data -> data/live/<feed>/YYYY-MM-DD.csv, pushed about every hour.
# ⚠️ GitHub only fires `schedule` from the repo's DEFAULT branch (main). Until a scheduler exists on main,
#    shifts start by hand (Actions tab → Run workflow) or via: gh workflow run live_recorder.yml --ref kalshi-twins
# ⚠️ Free minutes are unlimited only while the repo is PUBLIC. Private = 2,000 min/month (this uses ~41,000).
on:
  push:                     # a code change runs a short 12-min test shift
    branches: [kalshi-twins]
    paths: ["tools/live_recorder.py", ".github/workflows/live_recorder.yml"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this shift runs (max ~345)"
        default: "340"
      every:
        description: "Minutes between snapshots"
        default: "5"
  schedule:
    - cron: "7 */6 * * *"   # 00:07, 06:07, 12:07, 18:07 UTC

permissions:
  contents: write
  actions: write            # DIY relay: each shift starts the next one (schedule doesn't fire off main)

concurrency:
  group: kalshi-twins-live-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/live_recorder.py --minutes "${{ github.event.inputs.minutes || (github.event_name == 'push' && '12') || '340' }}" --every "${{ github.event.inputs.every || '5' }}"
      - name: Final push
        if: always()
        run: |
          git add data/live
          git diff --cached --quiet || git commit -m "live: end of shift $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin kalshi-twins && git push origin HEAD:kalshi-twins && break; sleep 15; done
      - name: Relay — start the next shift + Nautilus refresh + daily backfill (DIY scheduler)
        # GitHub ignores `schedule` on non-default branches, so each shift hands off to the next one.
        # Stop the chain: commit an empty file data/live/STOP. Restart: delete it and run this workflow once.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          git pull -q origin kalshi-twins || true
          if [ -f data/live/STOP ]; then echo "STOP file found - relay paused"; exit 0; fi
          # Dispatch by numeric workflow ID: `gh workflow run <file>` looks the file up on main and 404s.
          wf() { gh api "repos/$R/actions/workflows" --jq ".workflows[]|select(.path==\".github/workflows/$1\")|.id"; }
          go() { id=$(wf "$1"); [ -n "$id" ] && gh api -X POST "repos/$R/actions/workflows/$id/dispatches" -f ref=kalshi-twins; }
          go live_recorder.yml && echo "next shift queued" || echo "::warning::relay failed"
          go nautilus.yml && echo "nautilus refresh queued" || true
          go truckstops.yml && echo "truckstop recorder queued" || true
          for f in backfill.yml gas_backfill.yml warehouse.yml; do   # daily pulls (their own schedule: never fires off main)
            last=$(gh api "repos/$R/actions/workflows/$(wf $f)/runs?branch=kalshi-twins&status=success&per_page=1" --jq '.workflow_runs[0].created_at' 2>/dev/null)
            age=$(( $(date -u +%s) - $(date -u -d "${last:-2000-01-01T00:00:00Z}" +%s) ))
            if [ "$age" -gt 72000 ]; then go $f && echo "$f queued (last success ${last:-never})"; fi
          done
