name: kalshi-twins nautilus

# NautilusTrader (pinned 2.0.0rc9) on free GitHub runners. Replays history + the newest live-recorder
# snapshots through the engine, checks the fee meter and the (locked) Kalshi demo node config,
# then commits small JSON reports to nautilus/reports/. No orders, no keys.
# Triggers: code changes under nautilus/, by hand, or the live recorder's relay at the end of every shift (~6h).
on:
  push:
    branches: [kalshi-twins]
    paths: ["nautilus/**", ".github/workflows/nautilus.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-twins-nautilus
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nautilus/requirements.txt
      - name: Install pinned engine
        run: pip install -r nautilus/requirements.txt
      - name: S00 replay check (recent events + live snapshots)
        run: python3 nautilus/run_backtest.py --strategy S00 2>&1 | grep -v " INFO \| DEBUG "
      - name: Fee meter self-check
        run: python3 nautilus/selfcheck_fees.py 2>&1 | grep -v " INFO \| DEBUG "
      - name: Demo node config check (locked, never connects)
        run: python3 nautilus/live_demo_node.py --check
      - name: Commit reports
        if: always()
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nautilus/reports
          git diff --cached --quiet && exit 0
          git commit -m "nautilus: reports $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin kalshi-twins && git push origin HEAD:kalshi-twins && break; sleep 15; done
