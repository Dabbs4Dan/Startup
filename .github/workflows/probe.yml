name: kalshi-twins source probe

# One-shot discovery runs (truckstop price APIs, Wayback state history). Started by hand or on change.
on:
  push:
    branches: [kalshi-twins]
    paths: ["tools/probe_sources.py", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-twins-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        run: python3 tools/probe_sources.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/engine_room/
          git diff --cached --quiet && exit 0
          git commit -m "probe: sources $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin kalshi-twins && git push origin HEAD:kalshi-twins && break; sleep 15; done
