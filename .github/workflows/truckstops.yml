name: kalshi-twins truckstops

# Truckstop pump prices (L3 input). 6 hourly snapshots per run, each saved right away; started by the live
# recorder's relay each shift, by hand, or a single snapshot on code change. Also refreshes the L3 scorecard
# (tools/truckstop_test.py -> research/engine_room/l3_truckstop_scorecard.csv).
on:
  push:
    branches: [kalshi-twins]
    paths: ["tools/truckstops.py", "tools/truckstop_test.py", ".github/workflows/truckstops.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-twins-truckstops
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record, score, and save every hour
        # Saves after EVERY hourly snapshot (a crash can lose at most one hour), then refreshes the L3 scorecard.
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          N=${{ github.event_name == 'push' && '1' || '6' }}
          for n in $(seq 1 $N); do
            start=$(date +%s)
            python3 tools/truckstops.py || echo "snapshot failed"
            python3 tools/truckstop_test.py || echo "scorecard failed"
            git add data/live/truckstops/ research/engine_room/l3_truckstop_scorecard.csv
            if ! git diff --cached --quiet; then
              git commit -q -m "truckstops: $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs origin kalshi-twins && git push -q origin HEAD:kalshi-twins && break; sleep 15; done
            fi
            if [ "$n" -lt "$N" ]; then
              left=$(( 3600 - ($(date +%s) - start) ))
              [ "$left" -gt 0 ] && sleep "$left"
            fi
          done
