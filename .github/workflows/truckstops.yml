name: kalshi-twins truckstops

# Truckstop pump prices (L3 input). Hourly snapshots for ~5.5h per run; started by the live recorder's relay
# each shift, by hand, or a single snapshot on code change.
on:
  push:
    branches: [kalshi-twins]
    paths: ["tools/truckstops.py", ".github/workflows/truckstops.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-twins-truckstops
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kalshi-twins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record
        run: python3 tools/truckstops.py --loop-minutes ${{ github.event_name == 'push' && '0' || '330' }} --every 60
      - name: Commit
        if: always()
        run: |
          git config user.name "kalshi-twins-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/truckstops/
          git diff --cached --quiet && exit 0
          git commit -m "truckstops: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin kalshi-twins && git push origin HEAD:kalshi-twins && break; sleep 15; done
